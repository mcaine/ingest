spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=create

spring.datasource.url=jdbc:postgresql_postGIS://localhost:5432/palantirjunior
spring.datasource.username=postgres
spring.datasource.password=bollox

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=net.postgis.jdbc.DriverWrapper

# JDBC write batching; matches the administrative-unit route aggregate size
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

camel.springboot.duration-max-idle-seconds=600
camel.dataformat.csv.use-maps=true
